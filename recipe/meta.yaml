{% set version = "0.2.11" %}

package:
  name: pyhyperscattering-base
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pyhyperscattering/pyhyperscattering-{{ version }}.tar.gz
  sha256: 59978487a0a64fef40a9a3527b19979e6c3a17f28a5efc7b1eafa32f4e651242

build:
  number: 0
  noarch: python

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - versioneer
  run:
    - python >={{ python_min }}
    - h5py
    - numpy
    - pandas
    - pyfai
    - scikit-image
    - scipy
    - pillow
    - xarray
    - bottleneck
    - tqdm
    - astropy-base
    - fabio
    - pydata-sphinx-theme
    - numexpr !=2.8.5,!=2.8.6
  run_constrained:
    - pyhyperscattering >={{ version }}
test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - PyHyperScattering
  commands:
    - pip check
outputs:
  - name: pyhyperscattering-base
    build:
      script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  - name: pyhyperscattering
    build:
      noarch: python
      script: "{{ PYTHON }} -c 'import sys; sys.exit(0)'"
    requirements:
      host:
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
        - {{ pin_subpackage("pyhyperscattering-base", max_pin="x.x.x") }}
        # ---------- all-nogpu extras ----------
        - tiled >=0.1.0a74
        - bluesky-tiled-plugins
        - pyopencl
        - dask
        - holoviews
        - hvplot
    test:
      requires:
        - python {{ python_min }}
        - pip
      commands:
        - pip check
      imports:
        - PyHyperScattering
  - name: pyhyperscattering-gpu
    build:
      noarch: python
      script: "{{ PYTHON }} -c 'import sys; sys.exit(0)'"
    requirements:
      host:
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
        - {{ pin_subpackage("pyhyperscattering-base", max_pin="x.x.x") }}
        # ---------- shared with all-nogpu ----------
        - tiled[client] >=0.1.0a74
        - bluesky-tiled-plugins
        - pyopencl
        - dask
        - holoviews
        - hvplot
        # ---------- GPU-specific additions ----------
        - cupy
        - cudatoolkit              # resolves to host GPU at install time
    test:
      requires:
        - python {{ python_min }}
        - pip
      commands:
        - pip check
      imports:
        - PyHyperScattering
about:
  summary: Utilities for loading, reducing, fitting, and plotting hyperspectral x-ray and neutron scattering data.
  license: NIST-PD-fallback
  home: https://github.com/usnistgov/PyHyperScattering

extra:
  feedstock-name: pyhyperscattering
  recipe-maintainers:
    - pbeaucage
